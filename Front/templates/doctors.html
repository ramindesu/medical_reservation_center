<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ doctor.first_name }} {{ doctor.last_name }}</title>
</head>
<body>
    <div class="container mt-5">
        <h1>Doctor {{ doctor.first_name }} {{ doctor.last_name }}</h1>
        <p>Specialty: {{ doctor.specialty.name }}</p>
        <p>Rate: {{ doctor.rate }} </p>

        <hr>

        <h3>Appointment request form</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Send a request</button>
        </form>
    </div>
</body>
</html>
