<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedReserve - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body, h1, h2, h3, p, a, i, footer, .btn-glass {
            color: var(--text-main) !important;
        }

        :root {
            --bg1: #4a90e2;
            --bg2: #50d8d7;

            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);

            --btn-bg: rgba(255, 255, 255, 0.28);

            --text-main: #ffffff;
        }

        body.dark-mode {
            --bg1: #0a0f1f;
            --bg2: #141a32;

            --glass-bg: rgba(0, 0, 0, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);

            --btn-bg: rgba(0, 0, 0, 0.35);

            --text-main: #f0f0f0;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.4s ease;
        }

        .header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header h2 {
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-btn {
            cursor: pointer;
            font-size: 22px;
            transition: 0.3s;
        }

        .toggle-btn:hover {
            transform: scale(1.15);
        }

        .center-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            width: 550px;
            padding: 40px;
            border-radius: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0, 0, 0, 0.25);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.5s ease-in-out;
            transition: background 0.3s ease, border 0.3s ease;
            margin-top: -60px;
        }

        .glass-card p {
            opacity: 0.9;
        }

        .btn-glass {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            background: var(--btn-bg);
            border: none;
            backdrop-filter: blur(12px);
            text-decoration: none;
            transition: 0.25s ease-in-out;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: translateY(-3px);
        }

        body.dark-mode .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            opacity: 0.85;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="{% url 'home' %}">
            <h2><i class="bi bi-hospital"></i> MedReserve</h2>
        </a>
        <i class="bi bi-moon-stars toggle-btn" id="darkToggle"></i>
    </header>

    <!-- CENTER CARD -->
    <div class="center-wrapper">
        <div class="glass-card">
            <h1><i class="bi bi-heart-pulse"></i> Welcome</h1>
            <p>Fast, simple & modern medical appointment booking.</p>

            <a href="{% url 'login' %}" class="btn-glass"><i class="bi bi-box-arrow-in-right"></i> Login</a>
            <a href="{% url 'register' %}" class="btn-glass"><i class="bi bi-person-plus"></i> Register</a>
            <a href="{% url 'doctors_list' %}" class="btn-glass"><i class="bi bi-people"></i> View All Doctors</a>
            <a href="{% url 'specialties' %}" class="btn-glass"><i class="bi bi-list-stars"></i> View Specialties</a>
            <a href="{% url 'about' %}" class="btn-glass"><i class="bi bi-info-circle"></i> About Us</a>
            <a href="{% url 'contact_us' %}" class="btn-glass"><i class="bi bi-envelope"></i> Contact Us</a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        © 2025 MedReserve | All Rights Reserved
    </footer>

    <!-- DARK MODE SCRIPT -->
    <script>
        const toggle = document.getElementById("darkToggle");
        const darkModeKey = "darkModeEnabled";

        // بررسی وضعیت ذخیره‌شده
        if (localStorage.getItem(darkModeKey) === "true") {
            document.body.classList.add("dark-mode");
            toggle.classList.remove("bi-moon-stars");
            toggle.classList.add("bi-sun");
        }

        toggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            const enabled = document.body.classList.contains("dark-mode");
            localStorage.setItem(darkModeKey, enabled);

            if (enabled) {
                toggle.classList.remove("bi-moon-stars");
                toggle.classList.add("bi-sun");
            } else {
                toggle.classList.remove("bi-sun");
                toggle.classList.add("bi-moon-stars");
            }
        });
    </script>

</body>
</html>
