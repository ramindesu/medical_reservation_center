<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Reservation System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #3a8ef6, #6ed0ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            border: none;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.12);
            animation: fadeIn 0.4s ease-in-out;
        }

        .card h1 {
            font-weight: 700;
            margin-bottom: 15px;
        }

        .btn-custom {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="card text-center mx-auto" style="max-width: 420px;">
            <h1>🏥 Medical Reservations</h1>
            <p class="text-muted">Choose an option to continue</p>

            <a href="#" class="btn btn-primary btn-custom">View Doctors</a>
            <a href="#" class="btn btn-outline-primary btn-custom">Patient Login</a>
            <a href="#" class="btn btn-outline-primary btn-custom">Doctor Login</a>
            <a href="#" class="btn btn-success btn-custom">Register</a>
        </div>
    </div>
</body>
</html>
