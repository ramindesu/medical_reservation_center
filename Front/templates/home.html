<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedReserve - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0,0,0,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }

        p {
            color: #eef;
            margin-bottom: 20px;
        }

        .btn-glass {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.26);
            border: none;
            backdrop-filter: blur(12px);
            color: white;
            transition: 0.2s;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1><i class="bi bi-hospital"></i> MedReserve</h1>
        <p>Book your medical appointments easily & quickly.</p>

        <a href="{% url 'login' %}" class="btn-glass"><i class="bi bi-box-arrow-in-right"></i> Login</a>
        <a href="{% url 'register' %}" class="btn-glass"><i class="bi bi-person-plus"></i> Register</a>
        <a href="{% url 'doctors_list' %}" class="btn-glass"><i class="bi bi-people"></i> View All Doctors</a>
        <a href="{% url 'specialties' %}" class="btn-glass"><i class="bi bi-people"></i> View All Specialties</a>
        <a href="{% url 'about' %}" class="btn-glass"><i class="bi bi-info-circle"></i> About Us</a>
        <a href="{% url 'contact_us' %}" class="btn-glass"><i class="bi bi-envelope"></i> Contact Us</a>
    </div>
</body>
</html>
