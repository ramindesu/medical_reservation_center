<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reservation Form for {{ doctor }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0; height: 100vh;
      background: linear-gradient(135deg, #4a90e2, #50d8d7);
      display: flex; justify-content: center; align-items: center;
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      width: 500px; padding: 40px; border-radius: 20px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 45px rgba(0,0,0,0.2);
      text-align: center; display: flex; flex-direction: column; gap: 15px;
      animation: fadeIn .5s ease-in-out;
    }
    h1 { font-weight: 700; color: #fff; margin-bottom: 10px; }
    p { color: #e0f7ff; margin: 0; }
    label { color: #eef; text-align: left; display: block; margin-top: 10px; }
    input, select, textarea {
      width: 100%; padding: 10px; border-radius: 8px; border: none;
      backdrop-filter: blur(12px); background: rgba(255,255,255,.2);
      color: #fff; margin-bottom: 10px;
    }
    input::placeholder, textarea::placeholder { color: #eee; }
    .btn-glass {
      width: 100%; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600;
      background: rgba(255, 255, 255, 0.26); border: none; backdrop-filter: blur(12px);
      color: white; transition: 0.2s;
    }
    .btn-glass:hover { background: rgba(255,255,255,.4); transform: translateY(-3px); }
    .errorlist { list-style: none; padding: 0; margin: 0 0 8px 0; color: #ffe5e5; text-align: left; font-size: .9rem; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <form method="post" class="glass-card">
    {% csrf_token %}

    <h1><i class="bi bi-person-vcard"></i> Reservation Form for {{ doctor }}</h1>
    <p>{{ doctor.specialty.name }}</p>

    {{ form.non_field_errors }}

    <div>
      <label for="{{ form.patient.id_for_label }}">Patient</label>
      {{ form.patient }}
      {{ form.patient.errors }}
    </div>

    <div>
      <label for="{{ form.date.id_for_label }}">Date</label>
      {{ form.date }}
      {{ form.date.errors }}
    </div>

    <div>
      <label for="{{ form.service.id_for_label }}">Service</label>
      {{ form.service }}
      {{ form.service.errors }}
    </div>

    <button type="submit" class="btn-glass" aria-label="Reserve with {{ doctor }}">
      <i class="bi bi-send"></i> Reserve with {{ doctor }}
    </button>
    <a href="/" class="btn-glass"><i class="bi bi-house"></i> Back to Home</a>
  </form>
</body>
</html>
