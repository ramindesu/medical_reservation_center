<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Specialties | MedReserve</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .glass-wrapper {
            margin-top: 80px;
            width: 90%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 24px;
            padding: 45px;
            backdrop-filter: blur(16px);
            box-shadow: 0px 25px 45px rgba(0,0,0,0.28);
            animation: fadeIn 0.6s ease-in-out;
            color: #fff;
            text-align: center;
        }

        h1 {
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0px 2px 6px rgba(0,0,0,0.3);
        }

        p.subtitle {
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .specialty-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.26);
            padding: 16px 20px;
            border-radius: 14px;
            margin: 12px 0;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: 0.25s;
        }

        .specialty-card:hover {
            background: rgba(255, 255, 255, 0.42);
            transform: translateY(-4px);
        }

        .specialty-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            color: #fff;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.25s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="glass-wrapper">

    <h1><i class="bi bi-clipboard2-pulse"></i> Medical Specialties</h1>
    <p class="subtitle">Select a specialty to see the available doctors.</p>

    {% if specialties %}
        {% for specialty in specialties %}
            <a href="{% url 'doctors_by_specialty' specialty.id %}" class="specialty-card">
                <span>
                    <i class="bi bi-heart-pulse-fill specialty-icon"></i>
                    {{ specialty.title }}
                </span>
                <i class="bi bi-chevron-right"></i>
            </a>
        {% endfor %}
    {% else %}
        <p class="mt-3">No specialties available.</p>
    {% endif %}

    <a href="/" class="back-btn">
        <i class="bi bi-arrow-left-circle"></i> Back to Home
    </a>

</div>

</body>
</html>
