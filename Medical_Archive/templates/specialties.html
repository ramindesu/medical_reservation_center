<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Specialties | MedReserve</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            margin-top: 80px;
            width: 90%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0,0,0,0.2);
            color: white;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 20px;
        }

        a.specialty-card {
            display: block;
            background: rgba(255, 255, 255, 0.26);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            transition: 0.25s ease-in-out;
            color: #fff;
            font-weight: 500;
            text-decoration: none;
        }

        a.specialty-card:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        a.back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #fff;
            font-weight: 500;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.25);
            padding: 10px 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        a.back-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="bi bi-clipboard2-pulse"></i> Medical Specialties</h1>
        <p class="mb-4">Choose a medical specialty to find available doctors.</p>

        {% if specialties %}
            {% for specialty in specialties %}
                <a href="{% url 'doctors_list' specialty.id %}" class="specialty-card">
                    <i class="bi bi-heart-pulse-fill"></i> {{ specialty.title }}
                </a>
            {% endfor %}
        {% else %}
            <p>No specialties found.</p>
        {% endif %}

        <a href="/" class="back-btn"><i class="bi bi-arrow-left-circle"></i> Back to Home</a>
    </div>
</body>
</html>
