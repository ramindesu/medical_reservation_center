<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Appointment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #4a90e2, #50d8d7); height:100vh; display:flex; align-items:center; justify-content:center;">
  <div class="card p-4 shadow" style="width: 100%; max-width: 480px; backdrop-filter: blur(10px); background-color: rgba(255,255,255,0.2); border-radius: 20px;">
    <h4 class="mb-4 text-white text-center"><i class="bi bi-calendar-plus"></i> Request Appointment</h4>

    {% for message in messages %}
      <div class="alert alert-warning">{{ message }}</div>
    {% endfor %}

    
    {% if appointment %}
      <p>Status: 
        <span class="badge text-dark 
          {% if appointment.status == 'waiting' %}
            {% if appointment.date <= today|add:"2 days" %}bg-danger{% else %}bg-warning{% endif %}
          {% elif appointment.status == 'approved' %}bg-success
          {% elif appointment.status == 'rejected' %}bg-danger
          {% elif appointment.status == 'blocked' %}bg-dark
          {% endif %}">
          {{ appointment.status|capfirst }}
          {% if appointment.status == 'waiting' and appointment.date <= today|add:"2 days" %}
            - Urgent
          {% endif %}
        </span>
      </p>
    {% endif %}


    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100 mt-3">Submit</button>
    </form>
  </div>
</body>
</html>
