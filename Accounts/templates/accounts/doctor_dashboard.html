<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard - MedReserve</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            width: 480px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        h1 {
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
        }

        .btn-glass {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px; /* فاصله بین آیکون و متن */
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.26);
            border: none;
            color: white;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        p {
            color: #eef;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>
            <i class="bi bi-person-badge"></i> Dr. {{ request.user.first_name }}
        </h1>
        <p>You have {{ reservations.count }} upcoming appointments</p>

        <a href="#" class="btn-glass">
            <i class="bi bi-calendar-check"></i>
            <span>My Appointments</span>
        </a>
        <a href="#" class="btn-glass">
            <i class="bi bi-people"></i>
            <span>Patients List</span>
        </a>
        <a href="#" class="btn-glass">
            <i class="bi bi-bar-chart-line"></i>
            <span>Statistics</span>
        </a>
        <a href="{% url 'home' %}" class="btn-glass">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
        </a>
    </div>
</body>
</html>
