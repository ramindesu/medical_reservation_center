<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Doctor Profile | MedReserve</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #3d7cd0, #57d8c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: "Inter", sans-serif;
        }

        .glass-box {
            width: 90%;
            max-width: 620px;
            background: rgba(255,255,255,0.22);
            backdrop-filter: blur(14px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(0,0,0,0.4);
        }

        .btn-glass {
            background: rgba(255,255,255,0.75);
            border-radius: 12px;
            padding: 10px;
            color: #005b7e;
            font-weight: 600;
            border: none;
        }

        .btn-glass:hover {
            background: #ffffff;
        }

        .btn-cancel {
            background: #ffefef;
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="glass-box">
    <h2>Edit Doctor Profile</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit"
                class="btn btn-glass w-100 mt-3"
                onclick="return confirmUpdate();">
            Save Changes
        </button>
    </form>

    <a href="{% url 'doctor_dashboard' %}" class="btn btn-cancel w-100 mt-3">
        Cancel / Back to Dashboard
    </a>
</div>

<script>
function confirmUpdate() {
    return confirm("Are you sure you want to update your profile?");
}
</script>

</body>
</html>
