<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - MedReserve</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
        }

        label {
            color: #eef;
            font-weight: 500;
            text-align: left;
            width: 100%;
        }

        input {
            border-radius: 10px;
            border: none;
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.26);
            color: white;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            background: rgba(255,255,255,0.35);
        }

        .btn-glass {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.26);
            border: none;
            backdrop-filter: blur(12px);
            color: white;
            transition: 0.2s;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        a {
            color: #fff;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        a:hover {
            text-decoration: underline;
        }

        .alert {
            background: rgba(255, 0, 0, 0.2);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1><i class="bi bi-shield-lock"></i> Change Password</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-glass mt-3">
                <i class="bi bi-check-circle"></i> Update Password
            </button>
        </form>

        <hr style="border-color: rgba(255,255,255,0.3); margin: 20px 0;">

        {% if request.user.role == 'doctor' %}
            <a href="{% url 'doctor_dashboard' %}" class="btn-glass">
                <i class="bi bi-arrow-left"></i> Back to Doctor Dashboard
            </a>
        {% elif request.user.role == 'patient' %}
            <a href="{% url 'patient_dashboard' %}" class="btn-glass">
                <i class="bi bi-arrow-left"></i> Back to Patient Dashboard
            </a>
        {% endif %}

        <a href="/" class="btn-glass mt-2">
            <i class="bi bi-house-door"></i> Back to Home
        </a>
    </div>
</body>
</html>
