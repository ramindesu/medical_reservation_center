<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedReserve - Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            width: 500px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0,0,0,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }

        .btn-glass {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.26);
            border: none;
            backdrop-filter: blur(12px);
            color: white;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        input.form-control, select.form-select {
            margin-bottom: 10px;
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1><i class="bi bi-person-plus"></i> Register</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" class="form-control" placeholder="Username" required id="id_username">
            <input type="text" name="first_name" class="form-control" placeholder="First Name" required id="id_first_name">
            <input type="text" name="last_name" class="form-control" placeholder="Last Name" required id="id_last_name">
            <input type="email" name="email" class="form-control" placeholder="Email" required id="id_email">
            <input type="text" name="phone" class="form-control" placeholder="Phone" required id="id_phone">
            <input type="text" name="address" class="form-control" placeholder="Address" required id="id_address">
            <input type="password" name="password1" class="form-control" placeholder="Password" required id="id_password1">
            <input type="password" name="password2" class="form-control" placeholder="Confirm Password" required id="id_password2">

            <select name="role" id="id_role" class="form-select" required>
                <option value="patient" {% if role == 'patient' %}selected{% endif %}>Patient</option>
                <option value="doctor" {% if role == 'doctor' %}selected{% endif %}>Doctor</option>
            </select>

            <div id="specialty-field" style="display:none;">
                <input type="text" name="specialty" class="form-control" placeholder="Specialty" id="id_specialty">
            </div>

            <button type="submit" class="btn-glass">Register</button>
        </form>

        <a href="{% url 'login' %}" class="btn-glass"><i class="bi bi-box-arrow-in-right"></i> Already have an account? Login</a>
    </div>

    <script>
        const roleSelect = document.getElementById('id_role');
        const specialtyField = document.getElementById('specialty-field');

        function toggleSpecialty() {
            if (roleSelect.value === 'doctor') {
                specialtyField.style.display = 'block';
            } else {
                specialtyField.style.display = 'none';
                document.getElementById('id_specialty').value = '';
            }
        }

        roleSelect.addEventListener('change', toggleSpecialty);
        window.addEventListener('load', toggleSpecialty);
    </script>
</body>
</html>
