<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<title> History </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #3d7cd0, #57d8c9);
      font-family: "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 0;
    }

    .glass-card {
      width: 95%;
      max-width: 700px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 35px;
      color: #eef6ff;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    h2 {
      color: #ffffff;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.35);
      margin-bottom: 10px;
    }

    .sub-text {
      font-size: 14px;
      opacity: 0.9;
    }

    .history-box {
      margin-top: 20px;
      background: rgba(0,0,0,0.18);
      border-radius: 12px;
      padding: 15px;
      font-size: 14px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .empty-text {
      margin-top: 15px;
      font-size: 15px;
      opacity: 0.9;
    }

    .back-btn {
      display: inline-block;
      margin-top: 18px;
      text-align: center;
      width: 100%;
      background: rgba(255,255,255,0.40);
      padding: 10px;
      border-radius: 10px;
      color: #003f5f;
      font-weight: 600;
      text-decoration: none;
      transition: .25s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.75);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="glass-card">

  <h2>
    <i class="bi bi-file-medical"></i>
    Patient Medical History
  </h2>

  <p class="sub-text mb-2">
    Patient:
    <strong>{{ patient.user.get_full_name }}</strong>
  </p>

  {% if history %}
    <div class="history-box">
      {{ history.history }}
    </div>
  {% else %}
    <p class="empty-text">
      There is no medical history recorded for this patient yet.
    </p>
  {% endif %}

  <a href="{% url 'patient_dashboard' %}" class="back-btn">
    <i class="bi bi-arrow-left-circle"></i>
    Back to Dashboard
  </a>

</div>

</body>
</html>
