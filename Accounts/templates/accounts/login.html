<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - MedReserve</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }

        label {
            color: #eef;
            font-weight: 500;
        }

        .btn-glass {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.26);
            border: none;
            backdrop-filter: blur(12px);
            color: white;
            transition: 0.2s;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        a {
            color: #fff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .alert {
            background: rgba(255, 0, 0, 0.2);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1><i class="bi bi-person-circle"></i> Login</h1>
        <p class="text-light">Sign in to access your MedReserve dashboard</p>

        {% if form.errors %}
            <div class="alert">Invalid username or password.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-glass mt-3">Sign In</button>
        </form>

        <div class="mt-3">
            <a href="{% url 'password_reset' %}">Forgot your password?</a>
        </div>
    </div>
</body>
</html>
