<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - MedReserve</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0px 25px 45px rgba(0,0,0,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-glass {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.26);
            border: none;
            color: white;
        }
    </style>
</head>

<body>
    <div class="glass-card">
        <h1 class="text-white"><i class="bi bi-envelope"></i> Forgot Password</h1>
        <p class="text-light">Enter your email address to reset your password.</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label text-light">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn-glass mt-3">Send Reset Link</button>
        </form>

        <div class="mt-3">
            <a href="{% url 'login' %}" class="text-white">← Back to Login</a>
        </div>
    </div>
</body>
</html>
