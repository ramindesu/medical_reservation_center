
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Give Feedback | MedReserve</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #3d7cd0, #57d8c9);
            font-family: "Inter", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .feedback-card {
            width: 95%;
            max-width: 550px;
            background: rgba(255,255,255,0.22);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 35px;
            color: #eef6ff;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
        }

        h2 {
            color: #fff;
            text-align: center;
            font-weight: 700;
            text-shadow: 0px 1px 4px rgba(0,0,0,0.35);
        }

        label {
            font-weight: 600;
            color: #fff;
        }

        .btn-glass {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 12px;
            background: rgba(255,255,255,0.55);
            color: #004d6f;
            transition: .25s;
        }

        .btn-glass:hover {
            background: rgba(255,255,255,0.9);
            transform: translateY(-3px);
        }

        .back-btn {
            display: inline-block;
            margin-top: 12px;
            text-align: center;
            width: 100%;
            background: rgba(255,255,255,0.40);
            padding: 10px;
            border-radius: 10px;
            color: #003f5f;
            font-weight: 600;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.75);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="feedback-card">

    <h2><i class="bi bi-star-fill"></i> Give Feedback</h2>

    <p class="text-center mb-4">
        Your feedback will help other patients choose their doctors.
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_rating" class="form-label">Rating (0–10)</label>
            {{ form.rating }}
        </div>
        <div class="mb-3">
            <label for="id_comment" class="form-label">Comment</label>
            {{ form.comment }}
        </div>

        <button type="submit" href="{% url 'patient_dashboard' %}" class="btn btn-glass mt-3">
            <i class="bi bi-check-circle"></i> Submit Feedback
        </button>
    </form>

    <a href="{% url 'patient_dashboard' %}" class="back-btn">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>

</div>

</body>
</html>
