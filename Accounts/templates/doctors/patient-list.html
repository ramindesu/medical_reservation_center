<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Past Appointments - MedReserve</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      margin: 0; padding: 0; min-height: 100vh;
      background: linear-gradient(135deg, #4a90e2, #50d8d7);
      display: flex; justify-content: center; align-items: center;
      font-family: 'Inter', sans-serif;
    }

    .glass-box {
      width: 860px; max-width: 95%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: fadeIn .6s ease-out;
    }

    h2 {
      color: #fff; font-weight: 700;
      text-align: center; margin-bottom: 20px;
    }

    .appt-card {
      background: rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 14px;
      backdrop-filter: blur(6px);
      color: #fff;
      transition: 0.25s;
    }

    .appt-card:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.35);
    }

    .appt-header {
      display: flex; justify-content: space-between;
      font-weight: 600; font-size: 17px;
    }

    .appt-details {
      margin-top: 6px; font-size: 15px; color: #eafaff;
    }

    .action-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 15px;
      background: rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      transition: .25s;
      font-weight: 500;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.45);
      transform: translateY(-3px);
    }

    .back-btn {
      width: 100%; margin-top: 25px;
      padding: 12px; font-size: 17px;
      background: rgba(255,255,255,0.28);
      border: none; border-radius: 12px;
      color: #fff; font-weight: 600;
      transition: .25s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-3px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="glass-box">

    <h2>
      <i class="bi bi-clock-history"></i>  
      Past Appointments
    </h2>

    {% if appointments %}
      {% for appt in appointments %}
        <div class="appt-card">

          <div class="appt-header">
            <span><i class="bi bi-person"></i> {{ appt.patient.user.get_full_name }}</span>
            <span><i class="bi bi-calendar"></i> {{ appt.date }}</span>
          </div>

          <div class="appt-details">
            <p><i class="bi bi-activity"></i> Service: {{ appt.service }}</p>
            <p><i class="bi bi-chat-left-quote"></i> Notes: {{ appt.notes|default:"—" }}</p>
          </div>

          <a href="{% url 'appointment_detail' appt.id %}" class="action-btn">
            <i class="bi bi-box-arrow-up-right"></i> View Details
          </a>

        </div>
      {% endfor %}
    {% else %}
      <p class="text-center text-light fs-5 mt-3">
        <i class="bi bi-info-circle"></i> No past appointments.
      </p>
    {% endif %}

    <a href="{% url 'doctor_dashboard' %}">
      <button class="back-btn">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
      </button>
    </a>

  </div>
</body>
</html>
