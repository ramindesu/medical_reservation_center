<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctors - MedReserve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 40px 20px;
            font-family: 'Inter', sans-serif;
        }
        .doctor-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .doctor-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="text-center text-white mb-5">
            <h1 class="display-4 mb-3"><i class="bi bi-heart-pulse"></i> Our Doctors</h1>
            <p class="lead">Specialist Medical Team</p>
        </div>

        
        <div class="row">
            {% for doctor in doctors %}
            <div class="col-lg-6 col-md-6 mb-4">
                <div class="doctor-card">
                   
                    <div class="d-flex align-items-center">
                        
                        <div class="flex-shrink-0">
                            <i class="bi bi-person-circle display-4 text-primary"></i>
                        </div>
                        
                       
                        <div class="flex-grow-1 ms-4">
                            <h4 class="mb-1">Dr. {{ doctor.user.first_name }} {{ doctor.user.last_name }}</h4>
                            <p class="text-muted mb-2">
                                <i class="bi bi-stethoscope"></i> {{ doctor.specialty.title }}
                            </p>
                            
                            
                            <div class="small text-muted">
                                <p class="mb-1">
                                    <i class="bi bi-envelope"></i> {{ doctor.user.email }}
                                </p>
                                {% if doctor.user.phone %}
                                <p class="mb-1">
                                    <i class="bi bi-telephone"></i> {{ doctor.user.phone }}
                                </p>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

       
        <div class="text-center text-white mt-4">
            <p class="mb-0">
                <i class="bi bi-info-circle"></i> 
                Showing {{ doctors.count }} doctors
            </p>
        </div>
    </div>
</body>
</html>
