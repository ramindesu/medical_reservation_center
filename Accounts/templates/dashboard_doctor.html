<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard - MedReserve</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50d8d7);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }

        .container {
            width: 90%;
            max-width: 900px;
        }

        h1 {
            color: white;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        .glass-card {
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            color: white;
            transition: 0.2s;
        }

        .glass-card:hover {
            transform: translateY(-3px);
        }

        .reservation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status {
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status.waiting { background-color: rgba(255, 193, 7, 0.5); }
        .status.approved { background-color: rgba(40, 167, 69, 0.5); }
        .status.rejected { background-color: rgba(220, 53, 69, 0.5); }
        .status.canceled { background-color: rgba(108, 117, 125, 0.5); }

        p { margin: 5px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="bi bi-person-badge"></i> Welcome, Dr. {{ request.user.first_name }}!</h1>

    {% if reservations %}
        {% for r in reservations %}
            <div class="glass-card">
                <div class="reservation-header">
                    <span><i class="bi bi-calendar-event"></i> {{ r.date }}</span>
                    <span class="status {{ r.status }}">{{ r.get_status_display }}</span>
                </div>
                <p><i class="bi bi-person-circle"></i> Patient: {{ r.patient.first_name }} {{ r.patient.last_name }}</p>
                <p><i class="bi bi-clipboard-check"></i> Service: {{ r.service }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p style="color: white; text-align: center;">No reservations yet.</p>
    {% endif %}
</div>
</body>
</html>
